name: PuTTY
options:
  bundleIdPrefix: com.oxapayy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.99.2
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: 1.6.0
targets:
  PuTTY:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: Citadel
      - package: SwiftTerm
      - package: swift-log
        product: Logging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oxapayy.puttyios
        PRODUCT_NAME: PuTTY
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PuTTY
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: PuTTY needs local network access to connect to SSH and Telnet servers on your network.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        DEBUG_INFORMATION_FORMAT: dwarf
        SWIFT_COMPILATION_MODE: wholemodule
  PuTTYUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: PuTTY
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oxapayy.puttyios.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: PuTTY
schemes:
  PuTTY:
    build:
      targets:
        PuTTY: all
        PuTTYUITests: [test]
    test:
      targets:
        - PuTTYUITests
