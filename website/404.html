<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · PuTTY for iOS</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/assets/icon.png" type="image/png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .lost { min-height: calc(100svh - 52px - 70px); display: grid; place-items: center; padding: 64px 24px; }
    .lost-inner { width: min(460px, 100%); text-align: center; }
    .lost h1 { font-size: clamp(36px, 6vw, 56px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; display: inline-flex; align-items: baseline; }
    .lost .lead { margin-top: 14px; font-size: 19px; color: var(--ink-2); }
    /* PuTTY's own error box, the one familiar thing on this page */
    .msgbox { margin: 40px auto 0; text-align: left; background: #fff; color: #000; border: 1px solid #1883d7;
      font: 14px/1.4 "Segoe UI", Tahoma, -apple-system, system-ui, sans-serif; box-shadow: 0 24px 50px -20px rgba(0,0,0,.35); }
    .msgbox-title { display: flex; align-items: center; gap: 8px; height: 34px; padding-left: 10px; }
    .msgbox-title span { flex: 1; }
    .msgbox-title b { width: 46px; text-align: center; font-weight: 300; font-size: 16px; }
    .msgbox-body { display: flex; gap: 14px; align-items: flex-start; padding: 18px 20px 22px; }
    .msgbox-icon { flex: none; width: 32px; height: 32px; border-radius: 50%; background: #e81123; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
    .msgbox-body code { font-family: inherit; font-weight: 600; word-break: break-all; }
    .msgbox-buttons { background: #f0f0f0; padding: 12px; display: flex; justify-content: flex-end; }
    .msgbox-buttons a { min-width: 92px; min-height: 32px; display: grid; place-items: center; background: #e1e1e1; border: 2px solid #0078d7; color: #000; font-size: 14px; }
    .msgbox-buttons a:hover { background: #e5f1fb; text-decoration: none; }
    .lost .hero-actions { margin-top: 36px; }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="nav-brand" href="/"><img src="/assets/icon.png" width="28" height="28" alt=""><span>PuTTY for iOS</span></a>
      <a class="btn btn-small" href="https://github.com/Oxapayy/putty-ios/releases/latest/download/PuTTY-iOS-unsigned.ipa">Download</a>
    </div>
  </header>

  <main class="lost">
    <div class="lost-inner">
      <h1>Page not found<span class="cursor" aria-hidden="true"></span></h1>
      <p class="lead">This address leads nowhere. The session ended before it began.</p>

      <div class="msgbox" role="alertdialog" aria-labelledby="mb-title" aria-describedby="mb-text">
        <div class="msgbox-title"><img src="/assets/icon.png" width="16" height="16" alt=""><span id="mb-title">PuTTY Fatal Error</span><b aria-hidden="true">✕</b></div>
        <div class="msgbox-body">
          <div class="msgbox-icon" aria-hidden="true">✕</div>
          <p id="mb-text">Network error: 404 Not Found<br><code id="path">/</code></p>
        </div>
        <div class="msgbox-buttons"><a href="/">OK</a></div>
      </div>

      <div class="hero-actions">
        <a class="btn" href="/">Back to PuTTY for iOS</a>
        <a class="link-more" href="https://github.com/Oxapayy/putty-ios">Source on GitHub</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>© 2026 Oxa · MIT licence · Unofficial; PuTTY is by Simon Tatham.</p>
    </div>
  </footer>
  <script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>
