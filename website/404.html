<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · PuTTY for iOS</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0d14">
  <link rel="icon" href="/assets/icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script>document.documentElement.classList.add("js")</script>
  <style>
    .lost { position: relative; min-height: 100svh; display: flex; align-items: center; overflow: hidden; background: var(--bg-deep); }
    .lost .hero-scene { opacity: 0.45; object-position: 80% 50%; }
    .lost::before {
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(to right, rgba(7, 8, 13, 0.92) 0, rgba(7, 8, 13, 0.6) 55%, rgba(7, 8, 13, 0.35) 100%);
    }
    .lost-grid {
      position: relative; z-index: 2; width: var(--page); margin: 0 auto; padding: 128px 0 96px;
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 560px); gap: 64px; align-items: center;
    }
    .lost h1 { font-size: 56px; line-height: 1.06; font-weight: 500; letter-spacing: -0.03em; max-width: 9em; }
    .lost .lead { margin-top: 20px; }
    .code-404 { font: 400 13px/20px var(--mono); color: var(--text-3); margin-bottom: 20px; }
    .code-404 span { color: var(--accent); }

    /* PuTTY's own terminal window */
    .term { background: #000; box-shadow: 0 0 0 1px #1883d7, 0 32px 80px rgba(0, 0, 0, 0.6); }
    .term-title { display: flex; align-items: center; gap: 8px; height: 32px; padding-left: 10px; background: #fff; color: #000; font: 13px "Segoe UI", Tahoma, -apple-system, system-ui, sans-serif; }
    .term-title span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .term-title b { width: 44px; text-align: center; font-weight: 400; }
    .term-body { min-height: 268px; padding: 12px 14px 16px; font: 15px/22px "Courier New", Courier, monospace; color: #bbbbbb; white-space: pre-wrap; word-break: break-all; }
    .term-body .err { color: #ff5555; }
    .term-body .ok { color: #55ff55; }
    .term-cursor { display: inline-block; width: 9px; height: 17px; background: #00ff00; vertical-align: -3px; }
    @media (max-width: 860px) {
      .lost-grid { grid-template-columns: 1fr; gap: 48px; padding-top: 112px; }
      .lost h1 { font-size: 40px; }
      .term-body { font-size: 13px; line-height: 20px; min-height: 236px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .js .lost .hero-scene { animation: scene-in 1800ms var(--ease) both; }
      .js .lost-copy > * { animation: rise 720ms var(--ease) both; }
      .js .lost-copy > :nth-child(2) { animation-delay: 60ms; }
      .js .lost-copy > :nth-child(3) { animation-delay: 120ms; }
      .js .lost-copy > :nth-child(4) { animation-delay: 180ms; }
      .js .term { animation: phone-in 900ms var(--ease) 200ms both; }
      @keyframes scene-in { from { opacity: 0; transform: scale(1.08); } }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
      @keyframes phone-in { from { opacity: 0; transform: translateY(40px); } }
    }
  </style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="/"><img src="/assets/icon.png" width="24" height="24" alt="">PuTTY for iOS</a>
    <a class="btn btn-sm" style="margin-left: auto" href="https://github.com/Oxapayy/putty-ios/releases/latest/download/PuTTY-iOS-unsigned.ipa">Download</a>
  </header>

  <main class="lost">
    <img class="hero-scene" src="/assets/hero-scene.webp" width="1360" height="768" alt="">
    <div class="lost-grid">
      <div class="lost-copy">
        <p class="code-404"><span>404</span> · Not found</p>
        <h1>Nothing at this address</h1>
        <p class="lead">The server looked and came back empty. The app, the download and the install guide are all on the home page</p>
        <div class="actions">
          <a class="btn" href="/">Back to the home page</a>
          <a class="link" href="https://github.com/Oxapayy/putty-ios/releases/latest/download/PuTTY-iOS-unsigned.ipa">Download the IPA<span class="arrow" aria-hidden="true">→</span></a>
        </div>
      </div>
      <figure class="term" aria-label="A PuTTY terminal requesting this address and getting HTTP 404 back">
        <div class="term-title"><img src="/assets/icon.png" width="16" height="16" alt=""><span>www.iosxputty.cc - PuTTY</span><b aria-hidden="true">✕</b></div>
        <div class="term-body" id="term" aria-hidden="true"></div>
      </figure>
    </div>
  </main>

  <script>
    (() => {
      const term = document.getElementById('term');
      const path = location.pathname + location.search;
      const prompt = 'guest@iosxputty:~$ ';
      // Each entry: [text typed by the user, output printed by the server]
      const script = [
        ['login as: ', 'guest', ''],
        ["guest@www.iosxputty.cc's password: ", '', ''],
        [prompt, `curl -sI https://www.iosxputty.cc${path}`, [['err', 'HTTP/2 404'], ['', 'content-type: text/html; charset=utf-8']]],
        [prompt, 'cd /', [['ok', '→ www.iosxputty.cc']]],
        [prompt, '', ''],
      ];
      const cursor = () => Object.assign(document.createElement('span'), { className: 'term-cursor' });
      const line = (cls, text) => {
        const s = document.createElement('span');
        if (cls) s.className = cls;
        s.textContent = text + '\n';
        return s;
      };
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (reduced) {
        for (const [p, typed, out] of script) {
          term.append(p + typed + (p === prompt && !typed ? '' : '\n'));
          if (Array.isArray(out)) out.forEach(([c, t]) => term.append(line(c, t)));
        }
        term.append(cursor());
        return;
      }

      const caret = cursor();
      let n = 0;
      const next = () => {
        if (n >= script.length) return;
        const [p, typed, out] = script[n++];
        const row = document.createTextNode(p);
        term.insertBefore(row, caret.parentNode ? caret : null);
        if (!caret.parentNode) term.append(caret);
        let i = 0;
        const tick = () => {
          if (i < typed.length) {
            row.textContent = p + typed.slice(0, ++i);
            setTimeout(tick, 34 + Math.random() * 46);
            return;
          }
          if (n === script.length) return; // last prompt: leave the cursor waiting
          setTimeout(() => {
            row.textContent += '\n';
            if (Array.isArray(out)) out.forEach(([c, t]) => term.insertBefore(line(c, t), caret));
            setTimeout(next, Array.isArray(out) ? 520 : 380);
          }, typed ? 260 : 700);
        };
        setTimeout(tick, 120);
      };
      setTimeout(next, 900);
    })();
  </script>
</body>
</html>
